<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Legado del Barrio | Linktree Oficial</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gangRed: '#dc2626',
                        gangYellow: '#facc15',
                        gangDark: '#09090b',
                        gangGray: '#18181b',
                        gangBorder: '#27272a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Courier New', 'monospace'],
                        police: ['Special Elite', 'cursive']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;800&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        .font-action { font-family: 'Anton', sans-serif; letter-spacing: 0.05em; }
        .font-typewriter { font-family: 'Special Elite', cursive; }
        .neon-glow-red { text-shadow: 0 0 10px rgba(220, 38, 38, 0.8), 0 0 20px rgba(220, 38, 38, 0.5); }
        .box-glow-red { box-shadow: 0 0 15px rgba(220, 38, 38, 0.4); }
        .stamp {
            border: 2px solid #dc2626;
            color: #dc2626;
            font-weight: 800;
            text-transform: uppercase;
            transform: rotate(-4deg);
            display: inline-block;
            padding: 0.2rem 0.5rem;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
    </style>
</head>
<body class="bg-gangDark text-gray-100 font-sans min-h-screen flex flex-col items-center justify-between py-10 px-4 selection:bg-gangRed selection:text-white">

    <!-- Top Security Banner -->
    <div class="w-full max-w-md bg-black border border-gangBorder text-[10px] text-gray-400 py-1.5 px-3 flex justify-between items-center font-mono uppercase tracking-widest rounded-t-lg">
        <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-gangRed animate-pulse"></span>
            <span class="text-gangRed font-bold">ALERTA ROJA</span>
        </div>
        <div><span>Lima Metropolitana</span></div>
    </div>

    <!-- Linktree Container -->
    <main class="w-full max-w-md bg-gangGray border-x border-b border-gangBorder rounded-b-xl shadow-2xl p-6 space-y-8">
        
        <!-- Profile Header -->
        <div class="text-center space-y-3">
            <div class="relative w-24 h-24 mx-auto rounded-full overflow-hidden border-2 border-gangRed box-glow-red p-1 bg-black">
                <img src="https://cdn.julcagallego.com/LegadoDelBarrio/El%20Legado%20Del%20Barrio%20-%20Audiolibro.jpeg" alt="El Legado del Barrio" class="w-full h-full object-cover rounded-full">
            </div>
            <div>
                <h1 class="font-action text-3xl text-white tracking-wider uppercase">
                    EL LEGADO DEL <span class="text-gangRed neon-glow-red">BARRIO</span>
                </h1>
                <p class="text-xs text-gangYellow font-mono uppercase tracking-widest mt-1">Proyecto Transmedia Oficial</p>
                <p class="text-xs text-gray-400 font-typewriter mt-2">"El barrio no olvida a sus protectores..."</p>
            </div>
        </div>

        <!-- Social Links (TikTok & Instagram) -->
        <div class="space-y-3">
            <a href="https://www.tiktok.com/@legado.de.barrioo" target="_blank" rel="noopener noreferrer" class="w-full bg-black/60 border border-gangBorder hover:border-gangRed p-4 rounded-xl flex items-center justify-between group transition-all duration-200 hover:translate-y-[-2px] box-glow-red">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gangRed/10 rounded-lg flex items-center justify-center text-gangRed group-hover:bg-gangRed group-hover:text-white transition">
                        <i class="fa-brands fa-tiktok text-xl"></i>
                    </div>
                    <div class="text-left">
                        <span class="font-mono text-[10px] text-gangRed uppercase tracking-wider block">Canal Oficial</span>
                        <span class="font-action text-lg text-white">TikTok // @legado.de.barrioo</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right text-gray-500 group-hover:text-gangRed transition"></i>
            </a>

            <a href="https://www.instagram.com/legado.de.barrio" target="_blank" rel="noopener noreferrer" class="w-full bg-black/60 border border-gangBorder hover:border-gangRed p-4 rounded-xl flex items-center justify-between group transition-all duration-200 hover:translate-y-[-2px]">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gangRed/10 rounded-lg flex items-center justify-center text-gangRed group-hover:bg-gangRed group-hover:text-white transition">
                        <i class="fa-brands fa-instagram text-xl"></i>
                    </div>
                    <div class="text-left">
                        <span class="font-mono text-[10px] text-gangRed uppercase tracking-wider block">Dossier Visual</span>
                        <span class="font-action text-lg text-white">Instagram // @legado.de.barrio</span>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right text-gray-500 group-hover:text-gangRed transition"></i>
            </a>
        </div>

        <!-- Section Dividers / Toggle Buttons for Modal/Views -->
        <div class="space-y-3 font-action">
            <button onclick="openModal('comics')" class="w-full py-4 bg-gangRed hover:bg-red-700 text-white rounded-xl text-xl tracking-wider uppercase transition flex items-center justify-center space-x-2 box-glow-red">
                <i class="fa-solid fa-book-open"></i>
                <span>Ver Cómics (Capítulos 1-4)</span>
            </button>

            <button onclick="openModal('audiobooks')" class="w-full py-4 bg-black border border-gangBorder hover:border-gangYellow text-gangYellow rounded-xl text-xl tracking-wider uppercase transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-headphones"></i>
                <span>Escuchar Audiolibros</span>
            </button>

            <button onclick="openModal('carnet')" class="w-full py-4 bg-black border border-gangBorder hover:border-gangRed text-white rounded-xl text-xl tracking-wider uppercase transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-id-card"></i>
                <span>Generar Carnet Clandestino</span>
            </button>
        </div>

        <!-- Footer Branding -->
        <div class="text-center pt-4 border-t border-gangBorder font-mono text-[10px] text-gray-500">
            <p>INSPIRADO EN EL UNIVERSO DE LA GRAN SANGRE</p>
            <p class="mt-1">© 2026 El Legado del Barrio</p>
        </div>
    </main>

    <!-- MODAL POPUP CONTAINER -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-gangGray border-2 border-gangRed rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6 relative space-y-6 box-glow-red">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl font-bold focus:outline-none">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modal-content" class="space-y-6">
                <!-- Dinámico -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LINKTREE LOGIC -->
    <script>
        const comicData = {
            1: {
                title: "Capítulo 1: Sombras en la Ruta",
                cover: "https://cdn.julcagallego.com/LegadoDelBarrio/Comic%20-%20Tomo%201/Portada.jpg",
                pages: Array.from({length: 10}, (_, i) => `https://cdn.julcagallego.com/LegadoDelBarrio/Comic%20-%20Tomo%201/Pagina%20${i+1}.jpg`)
            },
            2: {
                title: "Capítulo 2: Sombras del Poder",
                cover: "https://cdn.julcagallego.com/LegadoDelBarrio/Comic%20-%20Tomo%202/Portada.jpg",
                pages: Array.from({length: 10}, (_, i) => `https://cdn.julcagallego.com/LegadoDelBarrio/Comic%20-%20Tomo%202/Pagina%20-%20${i+1}.jpg`)
            },
            3: {
                title: "Capítulo 3: Una Advertencia",
                cover: "https://cdn.julcagallego.com/LegadoDelBarrio/Comic%20-%20Tomo%203/Portada%20-%203.jpg",
                pages: Array.from({length: 10}, (_, i) => `https://cdn.julcagallego.com/LegadoDelBarrio/Comic%20-%20Tomo%203/Pagina%20-%20${i+1}%20-%203.jpg`)
            },
            4: {
                title: "Capítulo 4: La Nueva Gran Sangre",
                cover: "https://cdn.julcagallego.com/LegadoDelBarrio/Comic%20-%20Tomo%204/Portada%20-%204.jpg",
                pages: Array.from({length: 10}, (_, i) => `https://cdn.julcagallego.com/LegadoDelBarrio/Comic%20-%20Tomo%204/Pagina%20${i+1}%20-%204.jpg`)
            }
        };

        function openModal(type, chNum = 1) {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            if(type === 'comics') {
                renderComicModal(chNum);
            } else if(type === 'audiobooks') {
                content.innerHTML = `
                    <div class="text-center border-b border-gangBorder pb-4">
                        <span class="stamp text-xs">REGISTROS AUDITIVOS</span>
                        <h3 class="font-action text-3xl text-white mt-1">AUDIOLIBROS OFICIALES</h3>
                    </div>
                    <div class="space-y-6">
                        <div class="bg-black/40 border border-gangBorder p-4 rounded-xl space-y-3">
                            <div class="flex items-center space-x-4">
                                <img src="https://cdn.julcagallego.com/LegadoDelBarrio/El%20Legado%20Del%20Barrio%20-%20Audiolibro.jpeg" class="w-16 h-16 object-cover rounded border border-gangRed">
                                <div>
                                    <h4 class="font-action text-xl text-white">Audiolibro - Capítulo 1</h4>
                                    <p class="font-typewriter text-xs text-gray-400">El primer contacto y la advertencia en las calles.</p>
                                </div>
                            </div>
                            <audio controls class="w-full accent-red-600"><source src="https://cdn.julcagallego.com/LegadoDelBarrio/Audiolibros/Audiolibro%20cap%201.mp3.mpeg" type="audio/mpeg"></audio>
                        </div>
                        <div class="bg-black/40 border border-gangBorder p-4 rounded-xl space-y-3">
                            <div class="flex items-center space-x-4">
                                <img src="https://cdn.julcagallego.com/LegadoDelBarrio/El%20Legado%20Del%20Barrio%20-%20Audiolibro.jpeg" class="w-16 h-16 object-cover rounded border border-gangRed">
                                <div>
                                    <h4 class="font-action text-xl text-white">Audiolibro - Capítulo 2</h4>
                                    <p class="font-typewriter text-xs text-gray-400">Sombras del poder y registros offshore.</p>
                                </div>
                            </div>
                            <audio controls class="w-full accent-red-600"><source src="https://cdn.julcagallego.com/LegadoDelBarrio/Audiolibros/Audiolibro%202.mp3.mpeg" type="audio/mpeg"></audio>
                        </div>
                        <div class="bg-black/40 border border-gangBorder p-4 rounded-xl space-y-3">
                            <div class="flex items-center space-x-4">
                                <img src="https://cdn.julcagallego.com/LegadoDelBarrio/El%20Legado%20Del%20Barrio%20-%20Audiolibro.jpeg" class="w-16 h-16 object-cover rounded border border-gangRed">
                                <div>
                                    <h4 class="font-action text-xl text-white">Audiolibro - Capítulo 3</h4>
                                    <p class="font-typewriter text-xs text-gray-400">Sangre nueva y persecución final.</p>
                                </div>
                            </div>
                            <audio controls class="w-full accent-red-600"><source src="https://cdn.julcagallego.com/LegadoDelBarrio/Audiolibros/audio-libro-3.mp3" type="audio/mpeg"></audio>
                        </div>
                    </div>
                `;
            } else if(type === 'carnet') {
                content.innerHTML = `
                    <div class="text-center border-b border-gangBorder pb-4">
                        <span class="stamp text-xs">RECLUTAMIENTO ACTIVO</span>
                        <h3 class="font-action text-3xl text-white mt-1">GENERADOR DE CARNET CLANDESTINO</h3>
                    </div>
                    <div class="space-y-4 font-mono">
                        <div>
                            <label class="block text-xs text-gray-400 uppercase mb-1">Alias / Nombre de Recluta</label>
                            <input type="text" id="recrut-name" placeholder="Ej. Elías" class="w-full bg-gangDark border border-gangBorder rounded p-3 text-white focus:border-gangRed outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 uppercase mb-1">Zona de Operaciones</label>
                            <select id="recrut-zone" class="w-full bg-gangDark border border-gangBorder rounded p-3 text-white focus:border-gangRed outline-none">
                                <option>Zona Sur - Villa el Salvador</option>
                                <option>Zona Norte - Callao</option>
                                <option>Centro - Lima Cercado</option>
                                <option>Zona Este - San Juan de Lurigancho</option>
                            </select>
                        </div>
                        <button onclick="generateBadge()" class="w-full py-3.5 bg-gangRed text-white font-action text-lg tracking-wider rounded uppercase box-glow-red">Emitir Credencial</button>
                        
                        <div id="badge-output" class="hidden mt-6 p-6 bg-gangDark border-2 border-gangRed rounded-lg relative overflow-hidden space-y-4">
                            <div class="flex justify-between items-start border-b border-gangBorder pb-4">
                                <div>
                                    <span class="text-[10px] text-gangRed font-bold uppercase">República de la Calle // Red Clandestina</span>
                                    <h4 class="font-action text-xl text-white mt-1">CREDENCIAL DE RECLUTA</h4>
                                </div>
                                <span class="stamp text-[10px]">AUTORIZADO</span>
                            </div>
                            <div class="space-y-2 text-xs">
                                <div class="flex justify-between"><span class="text-gray-400">AGENTE:</span><span id="output-name" class="text-white font-bold">—</span></div>
                                <div class="flex justify-between"><span class="text-gray-400">SECTOR:</span><span id="output-zone" class="text-white font-bold">—</span></div>
                                <div class="flex justify-between"><span class="text-gray-400">FECHA:</span><span class="text-white font-bold">17/10/2026</span></div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function renderComicModal(chNum) {
            const content = document.getElementById('modal-content');
            const chapter = comicData[chNum];

            let html = `
                <div class="flex justify-between items-center border-b border-gangBorder pb-4">
                    <div>
                        <span class="stamp text-xs">ARCHIVO GRÁFICO</span>
                        <h3 class="font-action text-2xl text-white mt-1">${chapter.title}</h3>
                    </div>
                    <div class="flex space-x-2 font-mono text-xs">
                        <button onclick="renderComicModal(1)" class="px-2.5 py-1 rounded ${chNum===1?'bg-gangRed text-white':'bg-black text-gray-400'}">1</button>
                        <button onclick="renderComicModal(2)" class="px-2.5 py-1 rounded ${chNum===2?'bg-gangRed text-white':'bg-black text-gray-400'}">2</button>
                        <button onclick="renderComicModal(3)" class="px-2.5 py-1 rounded ${chNum===3?'bg-gangRed text-white':'bg-black text-gray-400'}">3</button>
                        <button onclick="renderComicModal(4)" class="px-2.5 py-1 rounded ${chNum===4?'bg-gangRed text-white':'bg-black text-gray-400'}">4</button>
                    </div>
                </div>
                <div class="mb-6 text-center">
                    <span class="font-mono text-xs text-gangRed uppercase block mb-2">Portada Oficial</span>
                    <img src="${chapter.cover}" class="max-w-xs mx-auto rounded border-2 border-gangRed box-glow-red">
                </div>
                <div>
                    <span class="font-mono text-xs text-gangRed uppercase block mb-3">Secuencia de Páginas</span>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            `;

            chapter.pages.forEach((page, idx) => {
                html += `<div class="bg-black p-1.5 rounded border border-gangBorder"><img src="${page}" class="w-full h-auto rounded"><span class="text-[9px] font-mono text-gangYellow block text-center mt-1">Pág. ${idx+1}</span></div>`;
            });

            html += `</div></div>`;
            content.innerHTML = html;
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        function generateBadge() {
            const name = document.getElementById('recrut-name').value.trim();
            const zone = document.getElementById('recrut-zone').value;
            if(!name) { alert('Ingrese su alias de recluta.'); return; }
            document.getElementById('output-name').innerText = name.toUpperCase();
            document.getElementById('output-zone').innerText = zone;
            document.getElementById('badge-output').classList.remove('hidden');
        }
    </script>
</body>
</html>
